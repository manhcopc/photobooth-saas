<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-label="Khung photobooth hồng tím mặc định">
  <defs>
    <linearGradient id="frameGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.92" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.92" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#831843" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="1800" fill="none" />
  <rect x="42" y="58" width="1116" height="1684" rx="78" fill="none" stroke="url(#frameGradient)" stroke-width="84" filter="url(#softShadow)" />
  <rect x="86" y="1554" width="1028" height="156" rx="48" fill="url(#frameGradient)" opacity="0.94" />

  <text x="600" y="1640" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="800" fill="#ffffff">
    Kỷ niệm xinh xắn
  </text>
  <text x="600" y="1700" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="8" fill="#fdf2f8">
    PHOTOBOOTH
  </text>

  <circle cx="1038" cy="152" r="54" fill="#a855f7" opacity="0.9" />
  <circle cx="162" cy="1652" r="48" fill="#f9a8d4" opacity="0.95" />
  <circle cx="1084" cy="1692" r="26" fill="#fdf2f8" opacity="0.85" />
  <circle cx="124" cy="126" r="24" fill="#fdf2f8" opacity="0.85" />
</svg>
